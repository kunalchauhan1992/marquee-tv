<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b8b99"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#0e0e13"/>
  <text x="40" y="54" fill="#fff" font-size="26" font-weight="600">How Marquee works</text>
  <text x="40" y="84" fill="#8b8b99" font-size="15">Home button on the left, where the rows come from on the right. Everything is cached on the TV.</text>

  <!-- Home path -->
  <g font-size="15">
    <rect x="40" y="120" width="250" height="70" rx="14" fill="#1b1b23" stroke="#33333f"/>
    <text x="60" y="150" fill="#fff" font-weight="600">Home button</text>
    <text x="60" y="173" fill="#8b8b99">or boot, or an app closes</text>

    <rect x="40" y="235" width="250" height="70" rx="14" fill="#1b1b23" stroke="#33333f"/>
    <text x="60" y="265" fill="#fff" font-weight="600">Google TV home opens</text>
    <text x="60" y="288" fill="#8b8b99">launcherx stays enabled</text>

    <rect x="40" y="350" width="250" height="84" rx="14" fill="#2a1420" stroke="#ff2e63"/>
    <text x="60" y="380" fill="#fff" font-weight="600">Marquee Home button</text>
    <text x="60" y="402" fill="#e4a3b6">accessibility service sees</text>
    <text x="60" y="422" fill="#e4a3b6">that window, opens Marquee</text>

    <rect x="40" y="470" width="250" height="56" rx="14" fill="#ff2e63"/>
    <text x="60" y="505" fill="#fff" font-weight="600">Marquee is on screen</text>
  </g>
  <g stroke="#8b8b99" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M165 190V230"/><path d="M165 305V345"/><path d="M165 434V465"/>
  </g>

  <!-- Marquee box -->
  <rect x="360" y="120" width="330" height="406" rx="18" fill="#15151c" stroke="#ff2e63" stroke-width="2"/>
  <text x="384" y="156" fill="#ff2e63" font-size="20" font-weight="600">Marquee</text>
  <g font-size="15" fill="#d6d6de">
    <text x="384" y="194">Hero: Watch now · Trailer · My list</text>
    <text x="384" y="226">Your apps (dock)</text>
    <text x="384" y="258">Trending in India this week</text>
    <text x="384" y="290">New and popular Hindi titles</text>
    <text x="384" y="322">Top rated, genres, worldwide</text>
    <text x="384" y="354">Movies · Shows · Apps · My list · Inputs</text>
    <text x="384" y="386">Details: where it streams,</text>
    <text x="384" y="408">"More like this"</text>
    <text x="384" y="440">Trailer in a pop-up window</text>
    <text x="384" y="472">Search</text>
  </g>
  <text x="384" y="508" fill="#8b8b99" font-size="13">~30 MB idle in the background, ~95 MB on screen</text>

  <!-- Sources -->
  <g font-size="15">
    <rect x="770" y="120" width="390" height="100" rx="14" fill="#1b1b23" stroke="#33333f"/>
    <text x="790" y="150" fill="#fff" font-weight="600">TMDB</text>
    <text x="790" y="174" fill="#8b8b99">titles, posters, trending, genres, keywords</text>
    <text x="790" y="196" fill="#8b8b99">"where to watch" in India (JustWatch data)</text>

    <rect x="770" y="236" width="390" height="78" rx="14" fill="#1b1b23" stroke="#33333f"/>
    <text x="790" y="266" fill="#fff" font-weight="600">IMDb daily ratings file</text>
    <text x="790" y="290" fill="#8b8b99">indexed on the TV · OMDb for newer titles</text>

    <rect x="770" y="330" width="390" height="78" rx="14" fill="#1b1b23" stroke="#33333f"/>
    <text x="790" y="360" fill="#fff" font-weight="600">YouTube</text>
    <text x="790" y="384" fill="#8b8b99">trailers, in their own short-lived process</text>

    <rect x="770" y="424" width="390" height="102" rx="14" fill="#1b1b23" stroke="#33333f"/>
    <text x="790" y="454" fill="#fff" font-weight="600">Your apps</text>
    <text x="790" y="478" fill="#8b8b99">Netflix · Prime Video · YouTube · JioHotstar</text>
    <text x="790" y="500" fill="#8b8b99">ZEE5 · Sony LIV: "Watch on" opens the app</text>
  </g>
  <g stroke="#8b8b99" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M765 170H695"/><path d="M765 275H695"/><path d="M765 369H695"/><path d="M695 475H765"/>
  </g>
</svg>
